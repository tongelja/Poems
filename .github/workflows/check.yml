name: Check poems.adoc

on:
  push:
    paths: ['poems.adoc', 'web/check_adoc.py']
  pull_request:
    paths: ['poems.adoc', 'web/check_adoc.py']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python web/check_adoc.py poems.adoc
